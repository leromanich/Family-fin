<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FamilyFinTracker</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FamilyFin">
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/dexie@4/dist/dexie.min.js"></script>
</head>
<body class="h-full text-slate-800 antialiased">
  <div id="root" class="h-full"></div>

  <script src="./db.js"></script>
  <script src="./sync.js"></script>
  <script src="./lock.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ============= CONFIGURATION SUPABASE =============
    // ⚠️ REMPLACE ces 2 valeurs par celles de ton projet Supabase
    const SUPABASE_URL = "https://oiuhotnsnradzabmdytk.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pdWhvdG5zbnJhZHphYm1keXRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMTM3NDUsImV4cCI6MjEwNjY4OTc0NX0.JCjqwM2HAgiIVX9YwMN63PGzeA6Q9Tl8qsyou1Pke1I";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ============= ECRAN PIN - CREATION =============
    function SetupPIN({ onComplete }) {
      const [step, setStep] = useState(1);
      const [pin1, setPin1] = useState('');
      const [pin2, setPin2] = useState('');
      const [error, setError] = useState('');
      const current = step === 1 ? pin1 : pin2;
      const setCurrent = step === 1 ? setPin1 : setPin2;

      const handleDigit = (d) => { setError(''); if (current.length < 6) setCurrent(current + d); };
      const handleDelete = () => setCurrent(current.slice(0, -1));

      const handleNext = async () => {
        if (step === 1) {
          if (pin1.length < 4) { setError('4 chiffres minimum'); return; }
          setStep(2);
        } else {
          if (pin2 !== pin1) { setError('Les codes ne correspondent pas'); setPin2(''); setStep(1); setPin1(''); return; }
          await setupPIN(pin1);
          onComplete();
        }
      };

      return (
        <div class="fixed inset-0 bg-indigo-600 flex flex-col items-center justify-center px-6 z-50">
          <div class="w-16 h-16 rounded-2xl bg-white/20 flex items-center justify-center text-white text-2xl mb-6">🔐</div>
          <h2 class="text-white font-bold text-lg mb-2 text-center">
            {step === 1 ? 'Choisissez votre code secret' : 'Confirmez votre code'}
          </h2>
          <p class="text-indigo-200 text-xs mb-8 text-center max-w-xs">
            Ce code protège vos données même si votre téléphone est perdu.
          </p>
          <div class="flex gap-3 mb-8">
            {[0,1,2,3,4,5].map(i => (
              <div key={i} class={`w-3.5 h-3.5 rounded-full ${i < current.length ? 'bg-white scale-110' : 'bg-white/30'}`} />
            ))}
          </div>
          {error && <div class="text-rose-200 text-xs mb-4">{error}</div>}
          <div class="grid grid-cols-3 gap-3 w-full max-w-xs">
            {[1,2,3,4,5,6,7,8,9].map(n => (
              <button key={n} type="button" onClick={() => handleDigit(String(n))}
                class="aspect-square bg-white/10 text-white text-2xl font-bold rounded-2xl">{n}</button>
            ))}
            <div></div>
            <button type="button" onClick={() => handleDigit('0')}
              class="aspect-square bg-white/10 text-white text-2xl font-bold rounded-2xl">0</button>
            <button type="button" onClick={handleDelete}
              class="aspect-square bg-white/10 text-white text-xl rounded-2xl">⌫</button>
          </div>
          <button onClick={handleNext}
            class="mt-8 bg-white text-indigo-600 font-bold px-8 py-3 rounded-2xl">
            {step === 1 ? 'Suivant' : 'Terminer'}
          </button>
        </div>
      );
    }

    // ============= ECRAN PIN - VERROUILLAGE =============
    function LockScreen({ onUnlock }) {
      const [pin, setPin] = useState('');
      const [error, setError] = useState('');
      const [attempts, setAttempts] = useState(0);

      const handleDigit = (d) => { setError(''); if (pin.length < 6) setPin(pin + d); };
      const handleDelete = () => setPin(pin.slice(0, -1));

      const handleValidate = async () => {
        if (pin.length < 4) { setError('4 chiffres minimum'); return; }
        const ok = await verifyPIN(pin);
        if (ok) { setPin(''); setAttempts(0); onUnlock(); }
        else {
          const newAttempts = attempts + 1;
          setAttempts(newAttempts);
          setPin('');
          setError(`Code incorrect (${newAttempts})`);
          if (newAttempts >= 3) {
            const delay = Math.min(2000 * (newAttempts - 2), 10000);
            await new Promise(r => setTimeout(r, delay));
          }
        }
      };

      return (
        <div class="fixed inset-0 bg-indigo-600 flex flex-col items-center justify-center px-6 z-50">
          <div class="w-16 h-16 rounded-2xl bg-white/20 flex items-center justify-center text-white text-2xl mb-6">🔒</div>
          <h2 class="text-white font-bold text-xl mb-2">FamilyFinTracker</h2>
          <p class="text-indigo-200 text-sm mb-8">Entrez votre code</p>
          <div class="flex gap-3 mb-8">
            {[0,1,2,3,4,5].map(i => (
              <div key={i} class={`w-3.5 h-3.5 rounded-full ${i < pin.length ? 'bg-white scale-110' : 'bg-white/30'}`} />
            ))}
          </div>
          {error && <div class="text-rose-200 text-xs mb-4 font-medium">{error}</div>}
          <div class="grid grid-cols-3 gap-3 w-full max-w-xs">
            {[1,2,3,4,5,6,7,8,9].map(n => (
              <button key={n} type="button" onClick={() => handleDigit(String(n))}
                class="aspect-square bg-white/10 text-white text-2xl font-bold rounded-2xl">{n}</button>
            ))}
            <div></div>
            <button type="button" onClick={() => handleDigit('0')}
              class="aspect-square bg-white/10 text-white text-2xl font-bold rounded-2xl">0</button>
            <button type="button" onClick={handleDelete}
              class="aspect-square bg-white/10 text-white text-xl rounded-2xl">⌫</button>
          </div>
          <button onClick={handleValidate}
            class="mt-8 bg-white text-indigo-600 font-bold px-8 py-3 rounded-2xl">Déverrouiller</button>
        </div>
      );
    }
    
    // ============= ECRAN AUTHENTIFICATION =============
    function AuthScreen() {
      const [isSignUp, setIsSignUp] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [errorMsg, setErrorMsg] = useState('');
      const [loading, setLoading] = useState(false);

      const handleAuth = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        setLoading(true);
        try {
          if (isSignUp) {
            const { error } = await supabase.auth.signUp({ email, password });
            if (error) throw error;
            alert("Inscription réussie ! Connectez-vous.");
            setIsSignUp(false);
          } else {
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
          }
        } catch (err) {
          setErrorMsg(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div class="flex-1 flex flex-col justify-center px-6 py-12">
          <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600 text-white font-black text-2xl mb-4">FT</div>
            <h2 class="text-2xl font-bold text-slate-900">FamilyFinTracker</h2>
            <p class="mt-1 text-sm text-slate-500">Gérez les finances familiales</p>
          </div>
          <div class="bg-slate-50 py-8 px-6 rounded-2xl border border-slate-100">
            <form class="space-y-4" onSubmit={handleAuth}>
              {errorMsg && <div class="p-3 text-xs bg-red-50 text-red-600 rounded-xl">{errorMsg}</div>}
              <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Email</label>
                <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)}
                  class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm" placeholder="famille@exemple.com" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mot de passe</label>
                <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)}
                  class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm" placeholder="••••••••" />
              </div>
              <button type="submit" disabled={loading}
                class="w-full py-3.5 bg-indigo-600 text-white font-semibold rounded-xl disabled:opacity-50 text-sm mt-2">
                {loading ? 'Patientez...' : (isSignUp ? "S'inscrire" : "Se connecter")}
              </button>
            </form>
            <div class="mt-6 text-center">
              <button onClick={() => { setIsSignUp(!isSignUp); setErrorMsg(''); }}
                class="text-xs text-indigo-600 font-medium">
                {isSignUp ? "Déjà un compte ? Connectez-vous" : "Pas de compte ? Inscrivez-vous"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ============= INDICATEUR DE SYNC =============
    function SyncIndicator() {
      const [status, setStatus] = useState({ state: navigator.onLine ? 'ok' : 'offline' });
      useEffect(() => {
        onSyncChange(setStatus);
        const on = () => setStatus({ state: 'ok' });
        const off = () => setStatus({ state: 'offline' });
        window.addEventListener('online', on);
        window.addEventListener('offline', off);
        return () => { window.removeEventListener('online', on); window.removeEventListener('offline', off); };
      }, []);
      const colors = { ok: 'bg-emerald-400', syncing: 'bg-amber-400 animate-pulse', offline: 'bg-slate-400', error: 'bg-rose-500' };
      const labels = { ok: 'En ligne', syncing: 'Sync…', offline: 'Hors ligne', error: 'Erreur' };
      return (
        <span class="flex items-center gap-1 text-[10px] font-semibold text-indigo-100">
          <span class={`w-2 h-2 rounded-full ${colors[status.state] || 'bg-slate-400'}`}></span>
          {labels[status.state] || 'Statut'}
        </span>
      );
    }

    // ============= DASHBOARD =============
    function Dashboard({ session, profile }) {
      const [activeTab, setActiveTab] = useState('user');
      const [operations, setOperations] = useState([]);
      const [groupData, setGroupData] = useState([]);
      const [showModal, setShowModal] = useState(false);
      const [loading, setLoading] = useState(true);

      const fetchData = async () => {
        setLoading(true);
        if (activeTab === 'user') {
          const localOps = await getMyOperations(session.user.id);
          setOperations(localOps);
          if (navigator.onLine) {
            runSync(supabase, session.user.id).then(() => {
              getMyOperations(session.user.id).then(setOperations);
            });
          }
        } else if (activeTab === 'group' && profile?.role === 'admin') {
          const profiles = await getProfilesLocal();
          const ops = await getAllOperations();
          const summary = profiles.map(p => {
            const userOps = ops.filter(o => o.user_id === p.id);
            const balance = userOps.reduce((acc, curr) =>
              curr.type === 'deposit' ? acc + Number(curr.amount) : acc - Number(curr.amount), 0);
            return { ...p, balance };
          });
          setGroupData(summary);
          if (navigator.onLine) {
            runSync(supabase, session.user.id).then(() => fetchData());
          }
        }
        setLoading(false);
      };

      useEffect(() => { fetchData(); }, [activeTab]);

      const calculateUserBalance = () =>
        operations.reduce((acc, curr) =>
          curr.type === 'deposit' ? acc + Number(curr.amount) : acc - Number(curr.amount), 0);

      const handleSignOut = () => supabase.auth.signOut();

      return (
        <div class="flex flex-col h-full">
          <header class="bg-indigo-600 text-white p-5 rounded-b-3xl shadow-lg">
            <div class="flex justify-between items-center mb-4">
              <div>
                <h1 class="font-bold text-lg">FamilyFinTracker</h1>
                <p class="text-xs text-indigo-200">{session.user.email}</p>
                <SyncIndicator />
              </div>
              <div class="flex items-center gap-2">
                <span class={`text-[10px] uppercase font-extrabold px-2 py-0.5 rounded-full ${profile?.role === 'admin' ? 'bg-amber-400 text-amber-950' : 'bg-indigo-500 text-white'}`}>
                  {profile?.role || 'Membre'}
                </span>
                <button onClick={handleSignOut} class="p-1.5 text-indigo-200 rounded-lg">🚪</button>
              </div>
            </div>
            {activeTab === 'user' && (
              <div class="bg-indigo-700/50 rounded-2xl p-4 border border-indigo-500/30">
                <span class="text-xs font-medium text-indigo-200 uppercase">Mon Solde</span>
                <div class="text-3xl font-extrabold mt-1">
                  {calculateUserBalance().toLocaleString('fr-FR', { minimumFractionDigits: 2 })} €
                </div>
              </div>
            )}
          </header>

          {profile?.role === 'admin' && (
            <div class="flex bg-slate-100 p-1 mx-5 mt-3 rounded-xl">
              <button onClick={() => setActiveTab('user')}
                class={`flex-1 py-2 text-xs font-semibold rounded-lg ${activeTab === 'user' ? 'bg-white text-indigo-600' : 'text-slate-500'}`}>
                Mon Espace
              </button>
              <button onClick={() => setActiveTab('group')}
                class={`flex-1 py-2 text-xs font-semibold rounded-lg ${activeTab === 'group' ? 'bg-white text-indigo-600' : 'text-slate-500'}`}>
                Vue Groupe
              </button>
            </div>
          )}

          <main class="flex-1 px-5 pt-6 overflow-y-auto pb-24">
            {loading ? (
              <p class="text-center text-xs text-slate-400 py-8">Chargement...</p>
            ) : activeTab === 'user' ? (
              <div>
                <div class="flex justify-between items-center mb-4">
                  <h3 class="font-bold text-slate-800 text-sm">Opérations</h3>
                  <button onClick={() => setShowModal(true)}
                    class="bg-indigo-600 text-white text-xs font-semibold px-3 py-2 rounded-xl">+ Ajouter</button>
                </div>
                {operations.length === 0 ? (
                  <div class="text-center py-10 border-2 border-dashed border-slate-200 rounded-2xl">
                    <p class="text-xs text-slate-400">Aucune opération</p>
                  </div>
                ) : (
                  <div class="space-y-3">
                    {operations.map((op) => (
                      <div key={op.id} class="flex items-center justify-between p-3.5 bg-slate-50 rounded-2xl border border-slate-100">
                        <div class="flex items-center gap-3">
                          <div class={`w-10 h-10 rounded-xl flex items-center justify-center font-bold ${op.type === 'deposit' ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}`}>
                            {op.type === 'deposit' ? '+' : '-'}
                          </div>
                          <div>
                            <p class="font-semibold text-slate-800 text-sm">{op.description || (op.type === 'deposit' ? 'Dépôt' : 'Dépense')}</p>
                            <p class="text-[10px] text-slate-400">{new Date(op.operation_date).toLocaleDateString('fr-FR')}</p>
                          </div>
                        </div>
                        <span class={`font-bold text-sm ${op.type === 'deposit' ? 'text-emerald-600' : 'text-slate-800'}`}>
                          {op.type === 'deposit' ? '+' : '-'}{Number(op.amount).toFixed(2)} €
                        </span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ) : (
              <div>
                <h3 class="font-bold text-slate-800 text-sm mb-4">Membres de la famille</h3>
                <div class="space-y-3">
                  {groupData.map((member) => (
                    <div key={member.id} class="p-4 bg-slate-50 rounded-2xl border border-slate-100 flex justify-between items-center">
                      <div>
                        <p class="font-bold text-slate-800 text-sm">{member.email}</p>
                        <span class="text-[10px] uppercase font-extrabold px-2 py-0.5 rounded-md bg-slate-200 text-slate-600">{member.role}</span>
                      </div>
                      <span class={`font-bold text-base ${member.balance >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                        {member.balance.toFixed(2)} €
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {showModal && (
            <AddOperationModal
              userId={session.user.id}
              onClose={() => setShowModal(false)}
              onSuccess={() => { setShowModal(false); fetchData(); }}
            />
          )}
        </div>
      );
    }

    // ============= MODAL NOUVELLE OPERATION =============
    function AddOperationModal({ userId, onClose, onSuccess }) {
      const [type, setType] = useState('expense');
      const [amount, setAmount] = useState('');
      const [description, setDescription] = useState('');
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!amount || Number(amount) <= 0) return;
        setLoading(true);
        const newOp = {
          id: generateUUID(),
          user_id: userId,
          type,
          amount: parseFloat(amount),
          description: description || null,
          operation_date: date,
          created_at: new Date().toISOString()
        };
        await saveOperationLocal(newOp);
        if (navigator.onLine) runSync(supabase, userId);
        setLoading(false);
        onSuccess();
      };

      return (
        <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-end justify-center">
          <div class="bg-white w-full max-w-md rounded-t-3xl p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
              <h3 class="font-bold text-slate-800 text-base">Nouvelle Opération</h3>
              <button onClick={onClose} class="text-slate-400 font-bold p-1">✕</button>
            </div>
            <form onSubmit={handleSubmit} class="space-y-4">
              <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl">
                <button type="button" onClick={() => setType('expense')}
                  class={`py-2.5 text-xs font-bold rounded-lg ${type === 'expense' ? 'bg-rose-500 text-white' : 'text-slate-500'}`}>Dépense</button>
                <button type="button" onClick={() => setType('deposit')}
                  class={`py-2.5 text-xs font-bold rounded-lg ${type === 'deposit' ? 'bg-emerald-500 text-white' : 'text-slate-500'}`}>Dépôt</button>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Montant (€)</label>
                <input type="number" step="0.01" required value={amount}
                  onChange={(e) => setAmount(e.target.value)}
                  class="w-full px-4 py-3 rounded-xl border border-slate-200 text-lg font-bold" placeholder="0.00" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Description</label>
                <input type="text" value={description}
                  onChange={(e) => setDescription(e.target.value)}
                  class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm" placeholder="Courses, argent de poche..." />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Date</label>
                <input type="date" required value={date}
                  onChange={(e) => setDate(e.target.value)}
                  class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm" />
              </div>
              <button type="submit" disabled={loading}
                class="w-full py-3.5 bg-indigo-600 text-white font-bold rounded-xl disabled:opacity-50 text-sm mt-4">
                {loading ? 'Enregistrement...' : 'Valider'}
              </button>
            </form>
          </div>
        </div>
      );
    }

    // ============= APP PRINCIPAL =============
    function App() {
      const [session, setSession] = useState(null);
      const [profile, setProfile] = useState(null);
      const [loading, setLoading] = useState(true);
      const [hasPinSet, setHasPinSet] = useState(null);
      const [locked, setLocked] = useState(true);
      const [needsPINSetup, setNeedsPINSetup] = useState(false);

      useEffect(() => {
        (async () => {
          const exists = await hasPIN();
          setHasPinSet(exists);
          setLocked(exists);
          setLoading(false);
        })();
        registerLockCallback(() => setLocked(true));
        startAutoLockWatcher();
      }, []);

      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
          if (session) fetchProfile(session.user.id);
        });
        const { data: { subscription } } = supabase.auth.onAuthStateChange((_e, s) => {
          setSession(s);
          if (s) fetchProfile(s.user.id);
          else setProfile(null);
        });
        return () => subscription.unsubscribe();
      }, []);

      useEffect(() => {
        if (session?.user?.id && navigator.onLine) {
          window.__runSync = () => runSync(supabase, session.user.id);
          runSync(supabase, session.user.id);
        }
      }, [session]);

      const fetchProfile = async (userId) => {
        try {
          const profiles = await getProfilesLocal();
          const cached = profiles.find(p => p.id === userId);
          if (cached) setProfile(cached);
          if (navigator.onLine) {
            const { data, error } = await supabase
              .from('profiles').select('*').eq('id', userId).single();
            if (!error && data) {
              setProfile(data);
              await saveProfilesLocal([data]);
            }
          }
        } catch (e) { console.warn('Profil en cache uniquement'); }
      };

      if (loading) {
        return (
          <div class="flex h-full items-center justify-center">
            <div class="h-10 w-10 animate-spin rounded-full border-4 border-indigo-600 border-t-transparent"></div>
          </div>
        );
      }

      if (hasPinSet && locked) {
        return <LockScreen onUnlock={() => setLocked(false)} />;
      }

      if (!hasPinSet && session && !needsPINSetup) {
        setNeedsPINSetup(true);
        return <SetupPIN onComplete={() => {
          setHasPinSet(true);
          setNeedsPINSetup(false);
          setLocked(false);
        }} />;
      }

      return (
        <div class="min-h-full flex flex-col max-w-md mx-auto bg-white shadow-xl relative">
          {!session ? <AuthScreen /> : <Dashboard session={session} profile={profile} />}
        </div>
      );
    }

    // ============= RENDU =============
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // ============= ENREGISTREMENT SERVICE WORKER =============
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW enregistré ✅'))
          .catch(err => console.log('Erreur SW :', err));
      });
    }
  </script>
</body>
